# Po każdej zmianie w repozytorium (np. wgraniu zdjęć i opisów do zdjecia/):
# 1. odświeża bazę (data/zdjecia.json), miniatury i podglądy,
# 2. zapisuje je w repozytorium,
# 3. publikuje stronę na GitHub Pages.
# Wymaga: Settings → Pages → Source: „GitHub Actions”.
name: Odśwież bazę i opublikuj stronę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zbuduj bazę zdjęć
        run: |
          pip install pillow
          python scripts/build.py

      - name: Zapisz wynik w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Odśwież bazę zdjęć"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
